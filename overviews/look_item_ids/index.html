<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GGE Look-items DEV</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.5.0/font/bootstrap-icons.min.css"
    rel="stylesheet">
  <link rel="icon" type="image/webp" href="../../img_base/favicon.ico">
  <link rel="stylesheet" href="../shared/shared.css">
  <link rel="stylesheet" href="./styles.css">
  <meta property="og:title" content="GGE Look-items DEV">
  <meta property="og:description" content="Effectless look item IDs and their Empire and E4K availability.">
</head>

<body>
  <div class="container">
    <div class="row">
      <div class="col-12 mb-2">
        <div id="topButtonsContainer">
          <a href="../../index.html" class="home-icon-link" aria-label="Home">
            <div class="home-icon"><i class="bi bi-house"></i></div>
          </a>
        </div>

        <div class="row note gx-1 gy-1 align-items-center pb-2">
          <div class="col-md-6 col-sm-12 position-relative">
            <div class="input-group">
              <input id="searchInput" class="form-control custom-input" type="search"
                placeholder="Search by name, look ID or skin ID..." aria-label="Search">
            </div>
          </div>
          <div class="col-md-6 col-sm-12">
            <select id="showFilter" class="form-select custom-select text-center" aria-label="Type filter">
              <option value="commander" selected>Commander skins</option>
              <option value="castellan">Castellan skins</option>
            </select>
          </div>
        </div>
      </div>

      <main id="content" class="container-fluid">
        <div id="tableWrap" class="look-table-wrap" hidden>
          <div class="look-table-header">
            <table class="look-table">
              <thead>
                <tr>
                  <th scope="col">ID</th>
                  <th scope="col">Preview</th>
                  <th scope="col">Name</th>
                  <th scope="col">EM</th>
                  <th scope="col">E4K</th>
                </tr>
              </thead>
            </table>
          </div>
          <div class="look-table-scroll">
            <table class="look-table">
              <tbody id="lookRows"></tbody>
            </table>
          </div>
          <p id="emptyState" class="filter-empty-message" hidden></p>
        </div>
      </main>
    </div>
  </div>

  <div id="imageModal" class="image-modal">
    <div class="image-modal-inner">
      <span class="image-modal-close">&times;</span>
      <img id="modalImage" class="image-modal-content" alt="">
      <div id="modalCaption"></div>
    </div>
  </div>

  <script type="module" src="./script.js"></script>
  <script type="module" src="../shared/ConsentInit.mjs"></script>
</body>

</html>
