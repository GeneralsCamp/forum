<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>GGE Battle Simulator</title>
    <link rel="icon" type="image/webp" href="../../img_base/favicon.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
  <meta property="og:title" content="Battle Simulator">
  <meta property="og:description" content="Tools, calculators and simulators.">
  <meta property="og:image" content="https://generalscamp.github.io/forum/img_base/battle_simulator/favicon-32x32.png">
</head>

<body>
    <div class="container attack-planning">
        <div class="general-info">
            <div class="general-side general-side-attack">
                <div class="general-bg1">
                    <img src="../../img_base/battle_simulator/unknown.png" alt="General Image" class="general-img">
                </div>
                <div class="general-actions">
                    <div class="square2 commander" title="Commander stats"></div>
                    <div class="square2 attack-basics" title="Attack basics"></div>
                </div>
            </div>

            <div class="vertical-line"></div>

            <div class="general-side general-side-defense">
                <div class="general-actions">
                    <div class="square2 defense-basics" title="Defense basics"></div>
                    <div class="square2 castellan" title="Castellan stats"></div>
                </div>
                <div class="general-bg2">
                    <img src="../../img_base/battle_simulator/unknown.png" alt="Enemy Image" class="enemy-img">
                </div>
            </div>
        </div>

        <div class="player-enemy-info d-flex justify-content-between align-items-center">
            <span>Attacker</span>
            <span style="margin-left: 8px;">VS</span>
            <span>Defender</span>
        </div>

        <div class="player-flanks d-flex justify-content-between align-items-center">
            <div class="row flanks ms-1">
                <button class="btn flanks-button sides" data-section="left">
                    <img src="../../img_base/battle_simulator/left-icon.webp" alt="L">
                </button>
                <button class="btn flanks-button sides active" data-section="front">
                    <img src="../../img_base/battle_simulator/front-icon.webp" alt="F">
                </button>
                <button class="btn flanks-button sides" data-section="right">
                    <img src="../../img_base/battle_simulator/right-icon.webp" alt="R">
                </button>
            </div>

            <span id="current-flank" class="current-flank-inline">Front</span>

        </div>

        <div class="accordion scrollable-content" id="attackWaves">
            <div id="wave-container"></div>
        </div>

        <div class="battle-action-bar">
            <button class="btn btn-dark flanks-button fullscreen-button" aria-label="Toggle fullscreen">
                <svg class="fullscreen-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M9 4H4V9M15 4H20V9M20 15V20H15M9 20H4V15"></path>
                </svg>
            </button>

            <button class="btn btn-dark flanks-button openAllWaves-button" aria-label="Open or close all waves"></button>

            <button class="btn btn-dark flanks-button preset-button" aria-label="Presets">
                <img src="../../img_base/battle_simulator/icon_presets.png" alt="" class="icon" />
            </button>

            <button class="btn btn-dark flanks-button catalog-button" aria-label="Troops and tools">
                <svg class="catalog-plus-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M12 4V20M4 12H20"></path>
                </svg>
            </button>

            <button class="btn flanks-button red-button battle-start-button">
                ATTACK
            </button>
        </div>

        <div id="notificationBar" class="notification-bar">
            <span id="notificationMessage"></span>
        </div>

        <div class="modal fade" id="battleReportModal" tabindex="-1" aria-labelledby="battleReportLabel"
            aria-hidden="true" data-bs-backdrop="static" data-bs-keyboard="false">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content battle-report">
                    <div class="modal-header d-flex justify-content-center">
                        <h5 class="modal-title" id="battleReportLabel">Battle Report</h5>
                        <div class="modal-header-actions">
                            <button type="button" class="modal-header-action modal-header-close" data-bs-dismiss="modal" aria-label="Close">&times;</button>
                        </div>
                    </div>
                    <div class="report-view-bar">
                        <select id="report-view-select" class="report-view-select" aria-label="Battle report view">
                            <option value="summary">Overview</option>
                        </select>
                        <select id="report-rng-select" class="report-view-select" aria-label="Battle RNG">
                            <option value="1">Normal RNG</option>
                            <option value="0.9">Bad luck</option>
                            <option value="1.1">Good luck</option>
                        </select>
                    </div>
                    <div class="report-side-bar">
                        <span id="report-side-label" class="report-control-label">FRONT</span>
                        <div class="report-side-buttons">
                            <button class="btn flanks-button-report sides" data-section="left">
                                <img src="../../img_base/battle_simulator/left-icon.webp" alt="L">
                            </button>
                            <button class="btn flanks-button-report sides active" data-section="front">
                                <img src="../../img_base/battle_simulator/front-icon.webp" alt="F">
                            </button>
                            <button class="btn flanks-button-report sides" data-section="right">
                                <img src="../../img_base/battle_simulator/right-icon.webp" alt="R">
                            </button>
                            <button class="btn flanks-button-report sides" data-section="cy">
                                <img src="../../img_base/battle_simulator/cy-icon.webp" alt="CY">
                            </button>
                        </div>
                    </div>
                    <div class="report-column-heads">
                        <div class="report-column-head report-column-head-attack">
                            <span>ATTACKER</span>
                            <strong id="report-attacker-total">0</strong>
                        </div>
                        <div class="report-column-head report-column-head-defense">
                            <span>DEFENDER</span>
                            <strong id="report-defender-total">0</strong>
                        </div>
                    </div>
                    <div class="modal-body battle-modal" id="battle-modal">
                        <div id="report-context-note" class="report-context-note"></div>
                        <div id="report-detail-columns" class="report-detail-columns"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="./js/main.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.min.js"></script>
  <script type="module" src="../../overviews/shared/ConsentInit.mjs"></script>
</body>

</html>
